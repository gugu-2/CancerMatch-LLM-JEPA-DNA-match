version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pathomatch
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  ai_engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai_engine
    ports:
      - "8001:8001"
    depends_on:
      - redis

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
